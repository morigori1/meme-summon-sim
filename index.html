<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ミーム召喚儀式バトル</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Press+Start+2P&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans JP', 'Rajdhani', 'MS Gothic', sans-serif;
            background: 
                radial-gradient(ellipse at top, rgba(0, 255, 136, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at bottom, rgba(255, 0, 255, 0.15) 0%, transparent 50%),
                linear-gradient(135deg, #0a0a1e 0%, #1a0a2e 50%, #0a1a2e 100%);
            background-attachment: fixed;
            color: #eee;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(
                    0deg,
                    rgba(0, 255, 136, 0.03) 0px,
                    transparent 1px,
                    transparent 2px,
                    rgba(0, 255, 136, 0.03) 3px
                );
            pointer-events: none;
            z-index: 1;
            animation: scanlines 8s linear infinite;
        }

        @keyframes scanlines {
            0% { transform: translateY(0); }
            100% { transform: translateY(10px); }
        }

        .game-container {
            max-width: 1000px;
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            border: 3px solid #00ff88;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 
                0 0 20px rgba(0, 255, 136, 0.4),
                0 0 40px rgba(0, 255, 136, 0.2),
                inset 0 0 60px rgba(0, 255, 136, 0.05);
            position: relative;
            z-index: 2;
            animation: containerGlow 3s ease-in-out infinite alternate;
        }

        @keyframes containerGlow {
            0% { box-shadow: 0 0 20px rgba(0, 255, 136, 0.4), 0 0 40px rgba(0, 255, 136, 0.2), inset 0 0 60px rgba(0, 255, 136, 0.05); }
            100% { box-shadow: 0 0 30px rgba(0, 255, 136, 0.6), 0 0 60px rgba(0, 255, 136, 0.3), inset 0 0 80px rgba(0, 255, 136, 0.08); }
        }

        h1 {
            text-align: center;
            color: #00ff88;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 
                0 0 10px #00ff88,
                0 0 20px #00ff88,
                0 0 30px #00ff88,
                0 0 40px #00ff88;
            margin-bottom: 25px;
            font-size: 2.5em;
            font-weight: 900;
            letter-spacing: 3px;
            animation: titlePulse 2s ease-in-out infinite;
        }

        @keyframes titlePulse {
            0%, 100% { text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88, 0 0 30px #00ff88; }
            50% { text-shadow: 0 0 20px #00ff88, 0 0 30px #00ff88, 0 0 40px #00ff88, 0 0 50px #00ff88; }
        }

        .screen-shake {
            animation: shake 0.3s ease-in-out;
        }

        .game-container {
            --shake-intensity: 1;
        }
        
        @keyframes shake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(calc(-8px * var(--shake-intensity)), calc(8px * var(--shake-intensity))) rotate(calc(-2deg * var(--shake-intensity))); }
            20% { transform: translate(calc(8px * var(--shake-intensity)), calc(-8px * var(--shake-intensity))) rotate(calc(2deg * var(--shake-intensity))); }
            30% { transform: translate(calc(-8px * var(--shake-intensity)), calc(8px * var(--shake-intensity))) rotate(calc(-2deg * var(--shake-intensity))); }
            40% { transform: translate(calc(8px * var(--shake-intensity)), calc(-8px * var(--shake-intensity))) rotate(calc(2deg * var(--shake-intensity))); }
            50% { transform: translate(calc(-6px * var(--shake-intensity)), calc(6px * var(--shake-intensity))) rotate(calc(-1deg * var(--shake-intensity))); }
            60% { transform: translate(calc(6px * var(--shake-intensity)), calc(-6px * var(--shake-intensity))) rotate(calc(1deg * var(--shake-intensity))); }
            70% { transform: translate(calc(-4px * var(--shake-intensity)), calc(4px * var(--shake-intensity))) rotate(calc(-1deg * var(--shake-intensity))); }
            80% { transform: translate(calc(4px * var(--shake-intensity)), calc(-4px * var(--shake-intensity))) rotate(calc(1deg * var(--shake-intensity))); }
            90% { transform: translate(calc(-2px * var(--shake-intensity)), calc(2px * var(--shake-intensity))) rotate(0deg); }
        }

        .phase-indicator {
            text-align: center;
            font-size: 1.2em;
            color: #ffaa00;
            margin-bottom: 20px;
            padding: 10px;
            background: rgba(255, 170, 0, 0.1);
            border-radius: 5px;
        }

        .ritual-phase, .battle-phase, .result-phase {
            display: none;
        }

        .ritual-phase.active, .battle-phase.active, .result-phase.active {
            display: block;
        }

        .battlefield-context {
            background: linear-gradient(135deg, rgba(255, 170, 0, 0.25) 0%, rgba(255, 100, 0, 0.25) 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            border: 2px solid rgba(255, 170, 0, 0.5);
            box-shadow: 
                0 0 20px rgba(255, 170, 0, 0.3),
                inset 0 0 30px rgba(255, 170, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .battlefield-context::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(255, 170, 0, 0.1) 50%,
                transparent 70%
            );
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .battlefield-context h3 {
            color: #ffaa00;
            font-family: 'Orbitron', sans-serif;
            font-size: 2em;
            font-weight: 900;
            margin-bottom: 15px;
            text-shadow: 
                0 0 10px #ffaa00,
                0 0 20px #ffaa00,
                0 0 30px #ff6600;
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
        }

        .context-tags {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .context-tag {
            background: rgba(0, 255, 136, 0.2);
            padding: 5px 15px;
            border-radius: 15px;
            border: 1px solid #00ff88;
            font-size: 0.9em;
        }

        .ingredient-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .ingredient-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(0, 255, 136, 0.05) 100%);
            border: 2px solid #444;
            border-radius: 12px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .ingredient-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .ingredient-card:hover::before {
            left: 100%;
        }

        .ingredient-card:hover {
            border-color: #00ff88;
            transform: translateY(-5px) scale(1.02);
            box-shadow: 
                0 8px 25px rgba(0, 255, 136, 0.4),
                0 0 30px rgba(0, 255, 136, 0.2),
                inset 0 0 20px rgba(0, 255, 136, 0.1);
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.15) 0%, rgba(0, 200, 136, 0.15) 100%);
        }

        .ingredient-card.selected {
            border-color: #00ff88;
            border-width: 3px;
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.25) 0%, rgba(0, 200, 136, 0.25) 100%);
            box-shadow: 
                0 0 30px rgba(0, 255, 136, 0.6),
                inset 0 0 30px rgba(0, 255, 136, 0.2);
            animation: cardPulse 1.5s ease-in-out infinite;
        }

        @keyframes cardPulse {
            0%, 100% { box-shadow: 0 0 30px rgba(0, 255, 136, 0.6), inset 0 0 30px rgba(0, 255, 136, 0.2); }
            50% { box-shadow: 0 0 40px rgba(0, 255, 136, 0.8), inset 0 0 40px rgba(0, 255, 136, 0.3); }
        }

        .ingredient-card h4 {
            color: #00ff88;
            margin-bottom: 8px;
        }

        .ingredient-tags {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .ingredient-tag {
            font-size: 0.75em;
            background: rgba(0, 255, 136, 0.2);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .summon-button {
            width: 100%;
            padding: 15px;
            font-size: 1.3em;
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .summon-button:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.5);
        }

        .summon-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .battle-arena {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .combatant {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
        }

        .combatant.player {
            border: 2px solid #00ff88;
        }

        .combatant.enemy {
            border: 2px solid #ff3366;
        }

        .combatant-avatar {
            font-size: 4em;
            margin: 20px 0;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 10px currentColor;
        }

        .combatant-name {
            font-size: 1.3em;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .player .combatant-name {
            color: #00ff88;
        }

        .enemy .combatant-name {
            color: #ff3366;
        }

        .combatant-hp {
            margin: 10px 0;
            font-size: 1.1em;
        }

        .hp-bar {
            width: 100%;
            height: 25px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 12px;
            overflow: hidden;
            margin-top: 8px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .hp-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.2) 0%, transparent 100%);
        }

        .hp-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88 0%, #00ff88 50%, #00cc6a 100%);
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 0 10px rgba(0, 255, 136, 0.6),
                inset 0 0 10px rgba(255, 255, 255, 0.3);
            position: relative;
            animation: hpShine 2s linear infinite;
        }

        @keyframes hpShine {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 0%; }
        }

        .enemy .hp-fill {
            background: linear-gradient(90deg, #ff3366 0%, #ff3366 50%, #cc2952 100%);
            box-shadow: 
                0 0 10px rgba(255, 51, 102, 0.6),
                inset 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .combatant-freshness {
            margin-top: 10px;
            font-size: 0.9em;
            color: #ffaa00;
        }

        .command-panel {
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .command-panel h3 {
            text-align: center;
            color: #00ff88;
            margin-bottom: 15px;
        }

        .command-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .command-button {
            padding: 20px 10px;
            font-size: 1.2em;
            background: linear-gradient(135deg, rgba(100, 100, 255, 0.15) 0%, rgba(150, 100, 255, 0.15) 100%);
            border: 2px solid #6666ff;
            border-radius: 10px;
            color: #eee;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Rajdhani', sans-serif;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .command-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .command-button:hover::before {
            width: 300px;
            height: 300px;
        }

        .command-button:hover:not(:disabled) {
            border-color: #00ff88;
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.3) 0%, rgba(0, 200, 200, 0.3) 100%);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 
                0 5px 20px rgba(0, 255, 136, 0.5),
                0 0 30px rgba(0, 255, 136, 0.3);
        }
        
        .command-button:active:not(:disabled) {
            transform: translateY(-1px) scale(0.98);
        }

        .command-button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        .command-button.selected {
            border-color: #00ff88;
            border-width: 3px;
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.4) 0%, rgba(0, 200, 200, 0.4) 100%);
            box-shadow: 
                0 0 25px rgba(0, 255, 136, 0.7),
                inset 0 0 20px rgba(0, 255, 136, 0.3);
            animation: buttonPulse 1s ease-in-out infinite;
            transform: scale(1.08);
        }

        @keyframes buttonPulse {
            0%, 100% { box-shadow: 0 0 25px rgba(0, 255, 136, 0.7), inset 0 0 20px rgba(0, 255, 136, 0.3); }
            50% { box-shadow: 0 0 35px rgba(0, 255, 136, 0.9), inset 0 0 30px rgba(0, 255, 136, 0.4); }
        }

        .battle-log {
            background: rgba(0, 0, 0, 0.85);
            padding: 18px;
            border-radius: 10px;
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 2px solid rgba(0, 255, 136, 0.3);
            box-shadow: 
                inset 0 0 20px rgba(0, 0, 0, 0.5),
                0 0 15px rgba(0, 255, 136, 0.2);
            font-family: 'Rajdhani', monospace;
        }

        .battle-log::-webkit-scrollbar {
            width: 8px;
        }

        .battle-log::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
        }

        .battle-log::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 136, 0.5);
            border-radius: 10px;
        }

        .battle-log::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 136, 0.8);
        }

        .log-entry {
            margin-bottom: 10px;
            padding: 10px 12px;
            border-left: 4px solid #00ff88;
            background: linear-gradient(90deg, rgba(0, 255, 136, 0.1) 0%, rgba(255, 255, 255, 0.02) 100%);
            border-radius: 4px;
            animation: logFadeIn 0.3s ease-out;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        @keyframes logFadeIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .log-entry.damage {
            border-left-color: #ff3366;
            background: linear-gradient(90deg, rgba(255, 51, 102, 0.15) 0%, rgba(255, 255, 255, 0.02) 100%);
            color: #ffccdd;
            font-weight: 600;
        }

        .log-entry.context-bonus {
            border-left-color: #ffaa00;
            background: linear-gradient(90deg, rgba(255, 170, 0, 0.15) 0%, rgba(255, 255, 255, 0.02) 100%);
            color: #ffeeaa;
            font-weight: 600;
        }

        .log-entry.system {
            border-left-color: #6666ff;
            background: linear-gradient(90deg, rgba(102, 102, 255, 0.15) 0%, rgba(255, 255, 255, 0.02) 100%);
            color: #ccccff;
            font-weight: 700;
            text-align: center;
        }

        .qte-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .qte-container.active {
            display: flex;
        }

        .qte-prompt {
            text-align: center;
            background: rgba(0, 255, 136, 0.1);
            padding: 50px;
            border: 3px solid #00ff88;
            border-radius: 15px;
            max-width: 500px;
        }

        .qte-prompt h2 {
            font-size: 2em;
            color: #00ff88;
            margin-bottom: 20px;
        }

        .qte-key {
            font-size: 4em;
            color: #ffaa00;
            margin: 30px 0;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        @keyframes fadeInScale {
            from { 
                opacity: 0; 
                transform: scale(0.5);
            }
            to { 
                opacity: 1; 
                transform: scale(1);
            }
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 10px rgba(0, 255, 136, 0.3); }
            50% { box-shadow: 0 0 30px rgba(0, 255, 136, 0.8); }
        }
        
        /* 儀式オーバーレイ */
        .ritual-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            flex-direction: column;
        }

        .ritual-overlay.active {
            display: flex;
        }

        .ritual-circle {
            position: relative;
            width: 500px;
            height: 500px;
            margin: 20px auto;
            filter: drop-shadow(0 0 30px rgba(0, 255, 136, 0.6));
        }

        .circle-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 3px solid rgba(0, 255, 136, 0.8);
            border-radius: 50%;
            animation: rotate 20s linear infinite;
            box-shadow: 
                0 0 10px rgba(0, 255, 136, 0.6),
                inset 0 0 10px rgba(0, 255, 136, 0.3);
        }

        .circle-layer:nth-child(1) {
            width: 450px;
            height: 450px;
            border-style: double;
            border-width: 5px;
            box-shadow: 
                0 0 20px rgba(0, 255, 136, 0.8),
                inset 0 0 20px rgba(0, 255, 136, 0.4);
        }

        .circle-layer:nth-child(2) {
            width: 380px;
            height: 380px;
            animation-duration: 15s;
            animation-direction: reverse;
            border-style: dashed;
        }

        .circle-layer:nth-child(3) {
            width: 310px;
            height: 310px;
            border-style: solid;
            animation-duration: 12s;
        }

        .circle-layer:nth-child(4) {
            width: 240px;
            height: 240px;
            animation-duration: 18s;
            animation-direction: reverse;
            border-style: dotted;
            border-width: 4px;
        }

        .circle-layer:nth-child(5) {
            width: 170px;
            height: 170px;
            border-style: double;
            animation-duration: 8s;
            border-width: 3px;
            box-shadow: 
                0 0 15px rgba(0, 255, 136, 0.9),
                inset 0 0 15px rgba(0, 255, 136, 0.5);
        }

        .ritual-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8em;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(0, 255, 136, 0.8));
            text-shadow: 
                0 0 20px rgba(0, 255, 136, 1),
                0 0 40px rgba(0, 255, 136, 0.8),
                0 0 60px rgba(0, 255, 136, 0.6);
        }

        .ritual-text {
            text-align: center;
            margin: 20px;
            max-width: 600px;
        }

        .ritual-catchphrase {
            font-size: 1.8em;
            color: #00ff88;
            margin-bottom: 15px;
            font-weight: bold;
            animation: fadeInScale 0.8s ease-out;
        }

        .ritual-lore {
            font-size: 1.1em;
            color: #aaa;
            line-height: 1.6;
            font-style: italic;
            animation: fadeInScale 1s ease-out 0.3s both;
        }

        .ritual-progress {
            width: 80%;
            max-width: 500px;
            margin: 20px auto;
            text-align: center;
        }

        .ritual-step {
            font-size: 1.3em;
            color: #ffaa00;
            margin-bottom: 15px;
            animation: pulse 1.5s infinite;
        }

        .ritual-gauge {
            width: 100%;
            height: 30px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #00ff88;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        .ritual-gauge-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88 0%, #00ffff 50%, #00cc6a 100%);
            width: 0%;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 0 20px rgba(0, 255, 136, 0.8),
                inset 0 0 15px rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .ritual-gauge-fill::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: gaugeShine 1.5s infinite;
        }

        @keyframes gaugeShine {
            0% { left: -100%; }
            100% { left: 200%; }
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, #00ff88 0%, #00ff88 50%, transparent 100%);
            border-radius: 50%;
            opacity: 0;
            animation: sparkle 2s infinite;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.8);
        }

        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 3000;
        }

        .flash-overlay.active {
            animation: flash 0.5s ease-out;
        }

        @keyframes flash {
            0% { opacity: 0; }
            50% { opacity: 0.9; }
            100% { opacity: 0; }
        }

        /* 衝撃波エフェクト */
        .shockwave {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border: 3px solid rgba(0, 255, 136, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 4000;
        }

        .shockwave.active {
            animation: shockwaveExpand 1s ease-out;
        }

        @keyframes shockwaveExpand {
            0% {
                width: 0;
                height: 0;
                opacity: 1;
                border-width: 5px;
            }
            100% {
                width: 1500px;
                height: 1500px;
                opacity: 0;
                border-width: 0px;
            }
        }

        /* ダメージポップアップ */
        .damage-popup {
            position: absolute;
            font-size: 3em;
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
            pointer-events: none;
            z-index: 100;
            animation: damageFloat 1s ease-out forwards;
        }

        .damage-popup.player-damage {
            color: #ff3366;
            text-shadow: 
                0 0 10px #ff3366,
                0 0 20px #ff3366,
                0 0 30px #ff3366;
        }

        .damage-popup.enemy-damage {
            color: #00ff88;
            text-shadow: 
                0 0 10px #00ff88,
                0 0 20px #00ff88,
                0 0 30px #00ff88;
        }

        .damage-popup.crit {
            font-size: 4.5em;
            color: #ffaa00;
            text-shadow: 
                0 0 20px #ffaa00,
                0 0 40px #ffaa00,
                0 0 60px #ff6600,
                0 0 80px #ff0000;
            animation: damageFloatCrit 1.5s ease-out forwards;
        }
        
        .damage-popup.graze {
            font-size: 1.5em;
            color: #888;
            opacity: 0.6;
            text-shadow: 
                0 0 5px #666;
        }
        
        @keyframes damageFloatCrit {
            0% {
                transform: translateY(0) scale(0.5) rotate(0deg);
                opacity: 1;
            }
            50% {
                transform: translateY(-80px) scale(1.3) rotate(10deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-150px) scale(1) rotate(-5deg);
                opacity: 0;
            }
        }

        @keyframes damageFloat {
            0% {
                transform: translateY(0) scale(0.5);
                opacity: 1;
            }
            50% {
                transform: translateY(-50px) scale(1.2);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) scale(1);
                opacity: 0;
            }
        }

        /* 戦闘員のグロー強化 */
        .combatant {
            text-align: center;
            padding: 25px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.03);
            position: relative;
        }

        .combatant.player {
            border: 3px solid #00ff88;
            box-shadow: 
                0 0 20px rgba(0, 255, 136, 0.4),
                inset 0 0 30px rgba(0, 255, 136, 0.1);
        }

        .combatant.enemy {
            border: 3px solid #ff3366;
            box-shadow: 
                0 0 20px rgba(255, 51, 102, 0.4),
                inset 0 0 30px rgba(255, 51, 102, 0.1);
        }

        .combatant-avatar {
            font-size: 5em;
            margin: 20px 0;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 15px currentColor);
        }

        .hit-flash {
            animation: hitFlash 0.3s ease-out;
        }

        @keyframes hitFlash {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(3) saturate(2); }
        }

        /* 配信アイテムボタン */
        .stream-item-button {
            padding: 12px 8px;
            font-size: 1em;
            background: linear-gradient(135deg, rgba(255, 170, 0, 0.3) 0%, rgba(255, 100, 0, 0.3) 100%);
            border: 2px solid #ffaa00;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Rajdhani', sans-serif;
        }

        .stream-item-button:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 170, 0, 0.5);
            border-color: #ffcc00;
        }

        .stream-item-button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        .stream-item-button.used {
            background: rgba(100, 100, 100, 0.3);
            border-color: #666;
        }

        .qte-timer {
            font-size: 1.5em;
            color: #ff3366;
            margin-top: 20px;
        }

        .result-display {
            text-align: center;
            padding: 40px;
        }

        .result-display h2 {
            font-size: 3em;
            margin-bottom: 20px;
        }

        .result-display.victory h2 {
            color: #00ff88;
            text-shadow: 0 0 20px #00ff88;
        }

        .result-display.defeat h2 {
            color: #ff3366;
            text-shadow: 0 0 20px #ff3366;
        }

        .result-display.draw h2 {
            color: #ffaa00;
            text-shadow: 0 0 20px #ffaa00;
        }

        .result-flavor {
            font-size: 1.3em;
            margin: 20px 0;
            line-height: 1.6;
        }

        .restart-button {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 1.2em;
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .restart-button:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 25px rgba(0, 255, 136, 0.5);
        }

        .turn-counter {
            text-align: center;
            font-size: 1.1em;
            color: #ffaa00;
            margin-bottom: 15px;
        }

        .match-indicator {
            display: inline-block;
            margin-left: 5px;
            padding: 2px 6px;
            background: rgba(255, 170, 0, 0.3);
            border-radius: 3px;
            font-size: 0.85em;
        }
        
        /* モバイル対応 */
        @media (max-width: 768px) {
            body {
                font-size: 14px;
                padding: 10px;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .game-container {
                padding: 15px;
            }
            
            .command-button {
                padding: 15px 8px;
                font-size: 1em;
            }
            
            .stream-item-button {
                padding: 10px 6px;
                font-size: 0.9em;
            }
            
            .combatant {
                padding: 10px;
            }
            
            .avatar {
                font-size: 3em;
            }
            
            .battle-log {
                max-height: 250px;
                font-size: 0.9em;
            }
            
            .result-display {
                padding: 20px;
            }
            
            .meme-selection {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 1.5em;
            }
            
            .game-container {
                padding: 10px;
            }
            
            .command-buttons {
                display: grid;
                grid-template-columns: 1fr;
                gap: 8px;
            }
            
            .command-button {
                width: 100%;
                padding: 18px 10px;
            }
            
            .stream-items-panel {
                padding: 10px;
            }
            
            .stream-items-panel > div {
                grid-template-columns: 1fr 1fr;
            }
            
            .meme-selection {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
            
            .ritual-circle {
                transform: scale(0.7);
            }
            
            .ritual-text {
                font-size: 0.9em;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>★ ミーム召喚儀式バトル ★</h1>
        
        <div class="phase-indicator" id="phaseIndicator">儀式準備中...</div>

        <!-- 儀式フェーズ -->
        <div class="ritual-phase active" id="ritualPhase">
            <div class="battlefield-context" id="battlefieldContext">
                <h3>戦場の空気</h3>
                <div class="context-tags" id="battlefieldTags"></div>
            </div>

            <h2 style="text-align: center; margin-bottom: 20px;">召喚するミームを選択せよ</h2>
            
            <div class="ingredient-selector" id="ingredientSelector"></div>
            
            <button class="summon-button" id="summonButton" disabled>
                ⚡ 儀式を執行する ⚡
            </button>
        </div>

        <!-- バトルフェーズ -->
        <div class="battle-phase" id="battlePhase">
            <div class="turn-counter" id="turnCounter"></div>

            <div class="battle-arena">
                <div class="combatant player">
                    <div class="combatant-name" id="playerName">???</div>
                    <div class="combatant-avatar" id="playerAvatar">?</div>
                    <div class="combatant-hp">
                        HP: <span id="playerHP">100</span> / 100
                        <div class="hp-bar">
                            <div class="hp-fill" id="playerHPBar" style="width: 100%"></div>
                        </div>
                    </div>
                    <div class="combatant-freshness">
                        鮮度: <span id="playerFreshness">100</span>%
                    </div>
                </div>

                <div class="combatant enemy">
                    <div class="combatant-name" id="enemyName">???</div>
                    <div class="combatant-avatar" id="enemyAvatar">?</div>
                    <div class="combatant-hp">
                        HP: <span id="enemyHP">100</span> / 100
                        <div class="hp-bar">
                            <div class="hp-fill" id="enemyHPBar" style="width: 100%"></div>
                        </div>
                    </div>
                    <div class="combatant-freshness">
                        鮮度: <span id="enemyFreshness">100</span>%
                    </div>
                </div>
            </div>

            <div class="context-fidelity-display" id="contextFidelityDisplay" style="text-align: center; margin-bottom: 15px; padding: 10px; background: rgba(255, 170, 0, 0.15); border-radius: 8px; border: 2px solid rgba(255, 170, 0, 0.5);">
                <strong style="color: #ffaa00;">文脈再現度:</strong> <span id="contextFidelityValue" style="font-size: 1.2em; color: #00ff88;">100</span>%
                <small style="display: block; margin-top: 5px; color: #aaa;">（ダメージ補正: <span id="fidelityBonus">±0</span>%）</small>
            </div>

            <div class="battle-log" id="battleLog"></div>
            
            <!-- 予兆・読み合い情報 -->
            <div id="predictionPanel" style="background: rgba(255, 0, 100, 0.1); padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 2px solid rgba(255, 0, 100, 0.3); display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div style="flex: 1;">
                        <strong style="color: #ff0088;">【予兆検知】</strong>
                        <div id="predictionText" style="font-size: 0.9em; margin-top: 5px; color: #ffaacc;"></div>
                    </div>
                    <div style="font-size: 2em;" id="predictionIcon">👀</div>
                </div>
            </div>

            <div class="command-panel">
                <h3>コマンド選択</h3>
                <div class="command-buttons">
                    <button class="command-button" data-command="attack">
                        攻撃<br><small>直接ダメージ</small>
                    </button>
                    <button class="command-button" data-command="feint">
                        フェイント<br><small>攻撃を無効化</small>
                    </button>
                    <button class="command-button" data-command="charge">
                        チャージ<br><small>次ターン強化</small>
                    </button>
                </div>
            </div>

            <div class="stream-items-panel" style="background: rgba(255, 170, 0, 0.15); padding: 15px; border-radius: 10px; margin-top: 15px; border: 2px solid rgba(255, 170, 0, 0.5);">
                <h3 style="text-align: center; color: #ffaa00; margin-bottom: 10px;">配信アイテム（各1回のみ）</h3>
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">
                    <button class="stream-item-button" id="item-superchat" data-item="superchat">
                        💵 スパチャ<br><small>HP+20</small>
                    </button>
                    <button class="stream-item-button" id="item-amagift" data-item="amagift">
                        🎁 あまぎふ<br><small>攻撃+15</small>
                    </button>
                    <button class="stream-item-button" id="item-hakushu" data-item="hakushu">
                        👏 拍手〇<br><small>鮮度+20</small>
                    </button>
                    <button class="stream-item-button" id="item-stamp" data-item="stamp">
                        🎭 スタンプ<br><small>敵混乱</small>
                    </button>
                </div>
            </div>
        </div>

        <!-- 結果フェーズ -->
        <div class="result-phase" id="resultPhase">
            <div class="result-display" id="resultDisplay">
                <h2 id="resultTitle">結果</h2>
                <div class="result-flavor" id="resultFlavor"></div>
                <button class="restart-button" id="restartButton">再挑戦</button>
            </div>
        </div>

        <!-- QTEオーバーレイ -->
        <div class="qte-container" id="qteContainer">
            <div class="qte-prompt">
                <h2 id="qteTitle">QTE!</h2>
                <div class="qte-key" id="qteKey">SPACE</div>
                <div class="qte-timer" id="qteTimer">3.0</div>
            </div>
        </div>

        <!-- 儀式オーバーレイ -->
        <div class="ritual-overlay" id="ritualOverlay">
            <div class="ritual-circle">
                <div class="circle-layer"></div>
                <div class="circle-layer"></div>
                <div class="circle-layer"></div>
                <div class="circle-layer"></div>
                <div class="circle-layer"></div>
                <div class="ritual-center" id="ritualAvatar">?</div>
                <div class="particles" id="ritualParticles"></div>
            </div>
            <div class="ritual-text">
                <div class="ritual-catchphrase" id="ritualCatchphrase">召喚中...</div>
                <div class="ritual-lore" id="ritualLore"></div>
            </div>
            <div class="ritual-progress">
                <div class="ritual-step" id="ritualStep">準備中...</div>
                <div class="ritual-gauge">
                    <div class="ritual-gauge-fill" id="ritualGaugeFill"></div>
                </div>
            </div>
        </div>

        <!-- フラッシュエフェクト -->
        <div class="flash-overlay" id="flashOverlay"></div>
        
        <!-- 衝撃波エフェクト -->
        <div class="shockwave" id="shockwave"></div>
    </div>

    <script src="memes.js"></script>
    <script src="qte.js"></script>
    <script src="game.js"></script>
</body>
</html>
